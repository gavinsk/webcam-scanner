<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Webcam to PDF Scanner (Stable + M4/iOS Crop Fix)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; text-align: center; margin: 20px; background: #f4f4f4; }
  #videoWrap { display:inline-block; max-width: 100%; }
  video { border: 2px solid #333; border-radius: 4px; display: block; margin: 0 auto; }
  #controls { margin-top: 8px; }
  button, select { margin: 5px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
  #diag { font-size: 12px; color: #333; margin-top: 6px; min-height: 1.2em; }

  .thumb-container { display: inline-block; vertical-align: top; text-align: center; margin: 5px; background: white; padding: 5px; border-radius: 4px; max-width: 260px; }
  .thumb-container img { display: block; height: 120px; margin: 0 auto 5px; border: 1px solid #ccc; cursor: pointer; }
  .page-label { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .status { font-size: 12px; margin: 2px 0; }
  .status.good { color: #1a7f37; }
  .status.warn { color: #b42318; font-weight: 600; }
  .status.muted { color: #666; }
  .status.debug { color: #888; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  #notice { font-size: 14px; color: #b42318; font-weight: 600; min-height: 1.2em; margin-top: 4px; }

  #cropModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); flex-direction: column; align-items: center; justify-content: flex-start; overflow: auto; padding: 20px; z-index: 2000; }
  #cropCanvas { background: white; cursor: crosshair; max-width: 95%; height: auto; touch-action: none; }
  .button-bar { position: sticky; bottom: 0; background: rgba(0,0,0,0.85); padding: 10px; display: flex; gap: 10px; justify-content: center; }

  #previewModal { display:none; position:fixed; inset:0; background: rgba(0,0,0,0.9); justify-content:center; align-items:center; z-index:3000; }
  #previewImage { max-width:90%; max-height:90%; transform-origin: center center; transition: transform 0.2s ease; cursor: grab; }
  #closePreview { position:absolute; top:20px; right:20px; padding:8px 12px; font-size:16px; cursor:pointer; }
</style>
</head>
<body>

<h1>Webcam to PDF Scanner</h1>

<div id="videoWrap">
  <video id="video" autoplay playsinline></video>
</div>

<div id="controls">
  <button id="startBtn">🎥 Start / Restart Camera</button>
  <label for="qualitySelect">PDF Quality:</label>
  <select id="qualitySelect">
    <option value="high" selected>High (Camera Max Resolution / Crop Actual)</option>
    <option value="standard">Standard (850×1100)</option>
  </select>
  <button id="captureBtn">📷 Capture Page (Enter)</button>
  <button id="downloadBtn">💾 Download PDF</button>
  <button id="flipBtn" style="display:none;">🔄 Flip Camera</button>
  <div id="diag"></div>
  <div id="notice"></div>
</div>

<div id="thumbnails"></div>

<!-- Crop Modal -->
<div id="cropModal">
  <canvas id="cropCanvas"></canvas>
  <div class="button-bar">
    <button id="applyCrop">✅ Apply Crop</button>
    <button id="cancelCrop">❌ Cancel</button>
  </div>
</div>

<!-- Preview Modal -->
<div id="previewModal">
  <img id="previewImage" src="">
  <button id="closePreview">❌ Close</button>
</div>

<script async src="https://docs.opencv.org/4.x/opencv.js" onload="cv['onRuntimeInitialized']=()=>{window.cvReady=true;}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="checks.js"></script>

<script>
(async function(){
  const video = document.getElementById('video');
  const startBtn = document.getElementById('startBtn');
  const flipBtn = document.getElementById('flipBtn');
  const captureBtn = document.getElementById('captureBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const qualitySelect = document.getElementById('qualitySelect');
  const thumbnails = document.getElementById('thumbnails');
  const diag = document.getElementById('diag');
  const controls = document.getElementById('controls');

  const cropModal = document.getElementById('cropModal');
  const cropCanvas = document.getElementById('cropCanvas');
  const cropCtx = cropCanvas.getContext('2d');
  const applyCropBtn = document.getElementById('applyCrop');
  const cancelCropBtn = document.getElementById('cancelCrop');

  const previewModal = document.getElementById('previewModal');
  const previewImage = document.getElementById('previewImage');
  const closePreview = document.getElementById('closePreview');

  let currentStream = null;
  let currentFacingMode = 'environment';
  let camW = 1280, camH = 720;
  let draggingPoint = null;
  let points = [];
  let croppingIndex = null;
  const capturedImages = [];
  const notice = document.getElementById('notice');
  const DEBUG = new URLSearchParams(location.search).has('debug');

  function setDiag(text) { diag.textContent = text; }
  function setNotice(text) { notice.textContent = text; }

  // Load an image object's data URL into a fresh <img>, resolving when ready.
  function loadImage(imgObj, dataUrl, w, h) {
    return new Promise(res => {
      const img = new Image();
      img.onload = () => { imgObj.data = dataUrl; imgObj.width = w; imgObj.height = h; imgObj.imageElement = img; res(); };
      img.src = dataUrl;
    });
  }

  // Rotate a captured page clockwise by deg (90/180/270).
  // imgObj.rotation tracks total rotation since capture, so orientation results stay valid.
  async function rotateImage(imgObj, deg) {
    const c = ScanChecks.rotateToCanvas(imgObj.imageElement, imgObj.width, imgObj.height, deg);
    await loadImage(imgObj, c.toDataURL('image/jpeg', 1.0), c.width, c.height);
    imgObj.rotation = (imgObj.rotation + deg) % 360;
  }

  // Degrees still needed to make the page upright, or null if unknown.
  function rotationStillNeeded(imgObj) {
    if (imgObj.orient.state !== 'ok') return null;
    return (imgObj.orient.target - imgObj.rotation + 360) % 360;
  }

  async function runOrientationCheck(imgObj) {
    const rotAtStart = imgObj.rotation;
    const result = await ScanChecks.detectOrientation(imgObj.imageElement, imgObj.width, imgObj.height);
    if (!capturedImages.includes(imgObj)) return; // deleted while checking
    imgObj.orient = { state: result.status, scores: result.scores };
    if (result.status === 'ok') {
      imgObj.orient.target = (rotAtStart + result.rotation) % 360;
      const needed = rotationStillNeeded(imgObj);
      const userTouched = imgObj.rotation !== rotAtStart;
      const beingCropped = cropModal.style.display === 'flex' && capturedImages[croppingIndex] === imgObj;
      if (needed && !userTouched && !beingCropped) {
        await rotateImage(imgObj, needed);
        imgObj.autoRotated = true;
      }
    }
    renderThumbnails();
  }

  function statusLines(imgObj) {
    const lines = [];
    const q = imgObj.quality;
    if (q) {
      if (q.ok) lines.push(['good', '✓ Sharp and well lit']);
      else lines.push(['warn', '⚠ ' + q.problems.join(', ') + ' — retake?']);
    }
    const o = imgObj.orient;
    if (o.state === 'checking') lines.push(['muted', '⏳ Checking orientation…']);
    else if (o.state === 'ok') {
      const needed = rotationStillNeeded(imgObj);
      if (needed === 0) lines.push(['good', imgObj.autoRotated ? '✓ Upright (auto-rotated)' : '✓ Upright']);
      else if (needed === 180) lines.push(['warn', '⚠ Looks upside down — use Rotate']);
      else lines.push(['warn', '⚠ Looks sideways — use Rotate']);
    }
    else if (o.state === 'unknown') lines.push(['muted', '? Couldn’t check orientation (no printed text found)']);
    else if (o.state === 'unavailable') lines.push(['muted', 'Orientation check unavailable']);
    if (DEBUG) {
      if (q) lines.push(['debug', `sharp ${q.sharpness} · bright ${q.brightness} · contrast ${q.contrast}`]);
      if (o.scores) lines.push(['debug', 'words ' + Object.entries(o.scores).map(([d, s]) => `${d}°:${s}`).join(' ')]);
    }
    return lines;
  }

  // --- Responsive preview (preserve aspect) ---
  function resizePreview() {
    const vpW = Math.max(320, window.innerWidth - 40);
    const reserved = Math.max(160, controls.offsetHeight + 40);
    const vpH = Math.max(240, window.innerHeight - reserved);
    const ar = camW / camH;
    let drawW = vpW; let drawH = Math.round(drawW / ar);
    if (drawH > vpH) { drawH = vpH; drawW = Math.round(drawH * ar); }
    video.style.width = drawW + 'px';
    video.style.height = drawH + 'px';
  }
  window.addEventListener('resize', resizePreview);

  async function countCameras() {
    try { const devs = await navigator.mediaDevices.enumerateDevices(); return devs.filter(d => d.kind==='videoinput').length; }
    catch { return 1; }
  }

  async function tryGet(constraints) {
    try { return await navigator.mediaDevices.getUserMedia(constraints); }
    catch(e){ return null; }
  }

  async function startCamera(preferredFacing = currentFacingMode) {
    if (currentStream) currentStream.getTracks().forEach(t => t.stop());
    const insecure = location.protocol !== 'https:' && location.hostname !== 'localhost';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setDiag('Camera API not available. Use Safari/Chrome over HTTPS.');
      return;
    }
    if (insecure) setDiag('Not HTTPS (or localhost) — camera may be blocked.');

    const attempts = [
      { label: 'rear+max', c: { video: { facingMode: { ideal: preferredFacing }, width: { ideal: 9999 }, height: { ideal: 9999 } } } },
      { label: 'rear',     c: { video: { facingMode: { ideal: preferredFacing } } } },
      { label: 'front',    c: { video: { facingMode: { ideal: (preferredFacing==='environment'?'user':'environment') } } } },
      { label: 'any',      c: { video: true } },
    ];

    let used = null, stream = null, lastErr = null;
    for (const a of attempts) {
      try { stream = await navigator.mediaDevices.getUserMedia(a.c); used = a.label; break; }
      catch(e){ lastErr = e; }
    }
    if (!stream) {
      console.error('getUserMedia failed:', lastErr);
      alert('Unable to access camera. If embedded (e.g., Schoology), open in a new tab. Ensure HTTPS and grant permission.');
      setDiag('Failed to start camera: ' + (lastErr && (lastErr.name+': '+lastErr.message)));
      return;
    }

    currentStream = stream;
    video.srcObject = stream;
    await new Promise(res => video.onloadedmetadata = res);

    camW = video.videoWidth || camW;
    camH = video.videoHeight || camH;
    setDiag(`Camera: ${used} | Resolution: ${camW}×${camH}`);
    flipBtn.style.display = (await countCameras()) > 1 ? 'inline-block' : 'none';
    resizePreview();
  }

  // Do NOT autostart; Safari/iFrames often require a user gesture.
  startBtn.onclick = () => { ScanChecks.warmUp(); startCamera(); };
  flipBtn.onclick = async () => { currentFacingMode = (currentFacingMode==='environment') ? 'user' : 'environment'; await startCamera(currentFacingMode); };

  // ENTER to capture
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter') captureBtn.click(); });

  function renderThumbnails(){
    thumbnails.innerHTML = "";
    capturedImages.forEach((imgObj, index) => {
      const container = document.createElement('div');
      container.className = "thumb-container";
      const label = document.createElement('div');
      label.className = 'page-label';
      label.textContent = `Page ${index + 1}`;
      container.appendChild(label);
      const img = document.createElement('img');
      img.src = imgObj.data; img.onclick = () => openPreview(imgObj.data);
      container.appendChild(img);

      statusLines(imgObj).forEach(([cls, text]) => {
        const s = document.createElement('div');
        s.className = 'status ' + cls;
        s.textContent = text;
        container.appendChild(s);
      });

      const rotateBtn = document.createElement('button');
      rotateBtn.textContent = "🔄 Rotate";
      rotateBtn.onclick = async () => { await rotateImage(imgObj, 90); imgObj.autoRotated = false; renderThumbnails(); };
      container.appendChild(rotateBtn);

      const cropBtn = document.createElement('button');
      cropBtn.textContent = "✂️ Crop";
      cropBtn.onclick = () => startCropping(index);
      container.appendChild(cropBtn);

      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = "🗑 Delete";
      deleteBtn.onclick = () => { capturedImages.splice(index, 1); renderThumbnails(); };
      container.appendChild(deleteBtn);

      thumbnails.appendChild(container);
    });
  }

  captureBtn.onclick = () => {
    if (!video.srcObject) { alert('Start the camera first.'); return; }
    const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
    const ctx = c.getContext('2d'); ctx.drawImage(video, 0, 0);

    const hi = (qualitySelect.value !== 'standard');
    const targetW = hi ? video.videoWidth  : 850;
    const targetH = hi ? video.videoHeight : 1100;

    const out = document.createElement('canvas'); out.width = targetW; out.height = targetH;
    out.getContext('2d').drawImage(c, 0, 0, targetW, targetH);

    const quality = ScanChecks.measureQuality(c, c.width, c.height);
    setNotice(quality.ok ? '' : `Page ${capturedImages.length + 1} looks ${quality.problems.join(' and ')}. Consider retaking it.`);

    const data = out.toDataURL('image/jpeg', 1.0);
    const img = new Image(); img.src = data;
    img.onload = () => {
      const imgObj = { data, width: out.width, height: out.height, imageElement: img,
                       rotation: 0, quality, orient: { state: 'checking' }, autoRotated: false };
      capturedImages.push(imgObj);
      renderThumbnails();
      runOrientationCheck(imgObj);
    };
  };

  // ===== Crop (layout-first + scale-aware) =====
  function ensureCropCanvasCssSize(){
    const rect = cropCanvas.getBoundingClientRect();
    if (!rect.width || !rect.height) {
      cropCanvas.style.maxWidth = "95vw";
      cropCanvas.style.width = Math.floor(window.innerWidth * 0.9) + "px";
      cropCanvas.style.height = "auto";
    }
  }
  window.addEventListener('resize', () => { if (cropModal.style.display === 'flex') { ensureCropCanvasCssSize(); drawCropOverlay(); } });

  function startCropping(index){
    if (!window.cvReady) { alert("OpenCV.js is still loading, please try again in a moment."); return; }
    croppingIndex = index; const imgObj = capturedImages[index];
    cropCanvas.width = imgObj.width; cropCanvas.height = imgObj.height;
    cropModal.style.display = "flex"; // show first so Safari lays out
    ensureCropCanvasCssSize();
    requestAnimationFrame(() => {
      cropCtx.drawImage(imgObj.imageElement, 0, 0);
      points = [
        {x: imgObj.width * 0.1, y: imgObj.height * 0.1},
        {x: imgObj.width * 0.9, y: imgObj.height * 0.1},
        {x: imgObj.width * 0.9, y: imgObj.height * 0.9},
        {x: imgObj.width * 0.1, y: imgObj.height * 0.9}
      ];
      drawCropOverlay();
    });
  }

  function drawCropOverlay(){
    const imgObj = capturedImages[croppingIndex];
    cropCtx.clearRect(0,0,cropCanvas.width,cropCanvas.height);
    cropCtx.drawImage(imgObj.imageElement, 0, 0);

    const rect = cropCanvas.getBoundingClientRect();
    const scale = rect.width > 0 ? (cropCanvas.width / rect.width) : 1;
    const handleR = Math.max(14, 18 * scale);
    const lineW   = Math.max(2,  2 * scale);

    cropCtx.strokeStyle = "red";
    cropCtx.lineWidth = lineW;
    cropCtx.beginPath();
    cropCtx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) cropCtx.lineTo(points[i].x, points[i].y);
    cropCtx.closePath();
    cropCtx.stroke();

    cropCtx.fillStyle = "yellow";
    cropCtx.strokeStyle = "#333";
    cropCtx.lineWidth = lineW;
    points.forEach(p => { cropCtx.beginPath(); cropCtx.arc(p.x, p.y, handleR, 0, 2*Math.PI); cropCtx.fill(); cropCtx.stroke(); });
  }

  function getCanvasCoordsFromPointer(e){
    const rect = cropCanvas.getBoundingClientRect();
    const scaleX = rect.width  > 0 ? (cropCanvas.width  / rect.width)  : 1;
    const scaleY = rect.height > 0 ? (cropCanvas.height / rect.height) : 1;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }

  cropCanvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const { x, y } = getCanvasCoordsFromPointer(e);
    draggingPoint = null;
    const rect = cropCanvas.getBoundingClientRect();
    const scale = rect.width > 0 ? (cropCanvas.width / rect.width) : 1;
    const hitR  = Math.max(18, 18 * scale);
    points.forEach((p, idx) => { if (Math.hypot(p.x - x, p.y - y) <= hitR) draggingPoint = idx; });
    if (draggingPoint !== null) cropCanvas.setPointerCapture?.(e.pointerId);
  });
  cropCanvas.addEventListener('pointermove', (e) => {
    if (draggingPoint === null) return; e.preventDefault();
    const { x, y } = getCanvasCoordsFromPointer(e);
    points[draggingPoint].x = x; points[draggingPoint].y = y; drawCropOverlay();
  });
  function endDrag(e){ if (draggingPoint !== null) { try { cropCanvas.releasePointerCapture?.(e.pointerId); } catch {} } draggingPoint = null; }
  cropCanvas.addEventListener('pointerup', endDrag);
  cropCanvas.addEventListener('pointercancel', endDrag);

  applyCropBtn.onclick = () => {
    const imgObj = capturedImages[croppingIndex];
    const hi = (qualitySelect.value !== 'standard');
    let dstW, dstH;
    if (!hi) { dstW = 850; dstH = 1100; }
    else {
      dstW = Math.round(Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y));
      dstH = Math.round(Math.hypot(points[3].x - points[0].x, points[3].y - points[0].y));
    }
    const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
      points[0].x, points[0].y, points[1].x, points[1].y,
      points[2].x, points[2].y, points[3].x, points[3].y
    ]);
    const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [ 0, 0, dstW-1, 0, dstW-1, dstH-1, 0, dstH-1 ]);
    const M = cv.getPerspectiveTransform(srcTri, dstTri);
    const srcMat = cv.imread(imgObj.imageElement);
    const dst = new cv.Mat();
    cv.warpPerspective(srcMat, dst, M, new cv.Size(dstW, dstH));

    const out = document.createElement('canvas'); out.width = dstW; out.height = dstH; cv.imshow(out, dst);
    srcTri.delete(); dstTri.delete(); M.delete(); srcMat.delete(); dst.delete();
    cropModal.style.display = "none";

    // Re-check quality on the cropped page (the desk/background no longer skews it).
    imgObj.quality = ScanChecks.measureQuality(out, dstW, dstH);
    loadImage(imgObj, out.toDataURL('image/jpeg', 1.0), dstW, dstH).then(renderThumbnails);
  };
  cancelCropBtn.onclick = () => { cropModal.style.display = "none"; };

  downloadBtn.onclick = () => {
    if (!capturedImages.length) { alert("No pages captured!"); return; }

    const issues = [];
    capturedImages.forEach((img, i) => {
      const p = `Page ${i + 1}`;
      if (img.quality && !img.quality.ok) issues.push(`${p}: ${img.quality.problems.join(', ')}`);
      if (img.orient.state === 'checking') issues.push(`${p}: still checking orientation`);
      const needed = rotationStillNeeded(img);
      if (needed === 180) issues.push(`${p}: looks upside down`);
      else if (needed) issues.push(`${p}: looks sideways`);
    });
    if (issues.length && !confirm("Some pages may have problems:\n\n" + issues.join('\n') + "\n\nDownload anyway?")) return;

    const { jsPDF } = window.jspdf; let pdf = null;
    capturedImages.forEach((img, index) => {
      if (index === 0) {
        pdf = new jsPDF({ orientation: img.width > img.height ? 'landscape' : 'portrait', unit: 'px', format: [img.width, img.height] });
      } else {
        pdf.addPage([img.width, img.height], img.width > img.height ? 'landscape' : 'portrait');
      }
      pdf.addImage(img.data, 'JPEG', 0, 0, img.width, img.height);
    });
    pdf.save('scan.pdf');
  };

  // Preview modal (tap a thumbnail)
  function openPreview(src){ previewImage.src = src; previewModal.style.display = 'flex'; }
  closePreview.onclick = () => { previewModal.style.display = 'none'; };
})();
</script>

</body>
</html>
